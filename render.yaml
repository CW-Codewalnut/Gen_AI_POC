# Render Blueprint — one Node web service serving the built app and the /api routes.
services:
  - type: web
    name: genui-studio
    runtime: node
    plan: free
    buildCommand: npm install; npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Set the value in the Render dashboard; never commit it.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
