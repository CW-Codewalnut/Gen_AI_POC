<!doctype html>
<html lang="en">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CodeWalnut Generative UI Studio — Claude composes interfaces from a component catalog in real time." />
    <title>Generative UI Studio · CodeWalnut</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        if (localStorage.getItem('genui-theme') === 'dark') document.documentElement.classList.add('dark')
      } catch {}
    </script>

    <script type="module" src="/src/main.tsx"></script>
